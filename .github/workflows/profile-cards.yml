# ---------------------------------------------------------------------------
#  Profile summary cards
#  Generates plain SVGs into profile-summary-card-output/<theme>/ and pushes
#  them, so the README points at files inside this repo instead of a live API.
#  README refs:
#    ./profile-summary-card-output/tokyonight/0-profile-details.svg
#    ./profile-summary-card-output/tokyonight/1-repos-per-language.svg
#    ./profile-summary-card-output/tokyonight/2-most-commit-language.svg
#    ./profile-summary-card-output/tokyonight/3-stats.svg
#    ./profile-summary-card-output/tokyonight/4-productive-time.svg
# ---------------------------------------------------------------------------
name: Profile summary cards

on:
  schedule:
    - cron: "0 2 * * *" # daily, 02:00 UTC (06:00 Dubai)
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          # IANA zone, so it stays UTC+4 with no DST surprises
          TIME_ZONE: "Asia/Dubai"
          THEME: tokyonight
          AUTO_PUSH: true
