# ---------------------------------------------------------------------------
#  Contribution snake
#  Reads the contribution grid, renders two SVGs (light + dark) and publishes
#  them to an orphan "output" branch. No third-party host involved.
#  README refs:
#    .../Qurayshe/output/github-contribution-grid-snake.svg
#    .../Qurayshe/output/github-contribution-grid-snake-dark.svg
# ---------------------------------------------------------------------------
name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # daily, 00:00 UTC (04:00 Dubai)
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake from contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # one output per line; query string customises the palette
          # %23 is a URL-encoded '#' (a raw '#' would truncate the query)
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%237aa2f7&color_dots=%23161b26,%233a3f55,%23565f89,%237aa2f7,%23bb9af7

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
