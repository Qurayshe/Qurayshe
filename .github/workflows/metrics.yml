# ---------------------------------------------------------------------------
#  Metrics  (lowlighter/metrics)
#  Renders github-metrics.svg into the repo root and commits it.
#  README ref: ./github-metrics.svg
#
#  Note: GITHUB_TOKEN only sees public data. For private contributions, create a
#  classic PAT with `repo` + `read:user` and add it as the METRICS_TOKEN secret,
#  then swap the token line below.
# ---------------------------------------------------------------------------
name: Metrics

on:
  schedule:
    - cron: "0 1 * * *" # daily, 01:00 UTC (05:00 Dubai)
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate profile metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Qurayshe
          filename: github-metrics.svg
          template: classic
          config_timezone: Asia/Dubai
          config_display: large
          config_theme: tokyonight
          config_output: svg
          base: header, activity, community, repositories, metadata

          # -- isometric commit calendar ---------------------------------
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # -- languages -------------------------------------------------
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%

          # -- habits ----------------------------------------------------
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_days: 14
          plugin_habits_from: 200

          # -- achievements ----------------------------------------------
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C

          # -- notable contributions -------------------------------------
          plugin_notable: yes
          plugin_notable_from: all

          # -- lines of code + starred topics ----------------------------
          plugin_lines: yes
          plugin_stars: yes
          plugin_stars_limit: 4
